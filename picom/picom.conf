opacity-rule = [
  "90:class_g = 'URxvt' && focused",
  "80:class_g = 'URxvt' && !focused"
];


# Backend - required for blur
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;
vsync = true;

# Blur settings
blur: {
  method = "dual_kawase";
  strength = 8;
  background = false;
  background-frame = false;
  background-fixed = false;
}

# Blur rules - target WezTerm specifically
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Apply blur only to transparent windows
blur-background = true;

# Transparency
inactive-opacity = 1.0;
active-opacity = 1.0;

# Opacity rules for WezTerm
opacity-rule = [
  "85:class_g = 'wezterm'"
];

# Fading
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
